# Site estático: dashboard catenária (index) + simulador 3D
# https://docs.netlify.com/configure-builds/overview/
#
# Env (Site settings → Environment variables):
#   CESIUM_API_KEY       — token Cesium Ion (obrigatório para costa 3D)
#   GOOGLE_MAPS_API_KEY  — opcional (Map Tiles API / Photorealistic)

[build]
  publish = "."
  # Gera `assets/tw.min.css` a partir de `tailwind.config.js` (classes nos HTML)
  command = "npm ci && npm run build:css"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Página de entrada: raiz
[[headers]]
  for = "/*.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
